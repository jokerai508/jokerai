<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Joker AI — Layout Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #1c1c1e;
        }
        .status-bar {
            height: 44px;
            background: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            color: #000;
        }
        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .tab-content.active {
            display: flex;
        }
        /* Chat Tab */
        .chat-header {
            height: 44px;
            background: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid #d1d1d6;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fff;
        }
        .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .bubble.user {
            align-self: flex-end;
            background: #007aff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: #e5e5ea;
            color: #000;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 8px 12px;
            background: #f2f2f7;
            border-top: 1px solid #d1d1d6;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d1d1d6;
            border-radius: 18px;
            font-size: 15px;
            outline: none;
        }
        .chat-input-area button {
            padding: 8px 16px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        /* Files Tab */
        .files-header {
            height: 44px;
            background: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid #d1d1d6;
        }
        .files-list {
            flex: 1;
            overflow-y: auto;
            background: #fff;
        }
        .file-item {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e5ea;
            font-size: 15px;
            color: #007aff;
            cursor: pointer;
        }
        .file-item:active {
            background: #f2f2f7;
        }
        /* Tab Bar */
        .tab-bar {
            height: 84px;
            background: #f2f2f7;
            border-top: 1px solid #d1d1d6;
            display: flex;
            justify-content: space-around;
            padding-bottom: 20px;
        }
        .tab-button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 10px;
            cursor: pointer;
        }
        .tab-button.active {
            color: #007aff;
        }
        .tab-button svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>●●●●○ WiFi</span>
        </div>
        <div class="content">
            <!-- Chat Tab -->
            <div class="tab-content active" id="chat-tab">
                <div class="chat-header">Joker AI</div>
                <div class="chat-messages" id="chat-messages">
                    <div class="bubble bot">Hello! I'm Joker AI. How can I help you today?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Message..." id="chat-input">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
            <!-- Files Tab -->
            <div class="tab-content" id="files-tab">
                <div class="files-header">Moomoo / Files</div>
                <div class="files-list">
                    <div class="file-item">📄 portfolio_report_2026.html</div>
                    <div class="file-item">📄 market-trend.html</div>
                    <div class="file-item">📄 malaysia-news.html</div>
                    <div class="file-item">📄 hourly_stock_analysis.md</div>
                </div>
            </div>
        </div>
        <div class="tab-bar">
            <button class="tab-button active" onclick="switchTab('chat')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <span>Chat</span>
            </button>
            <button class="tab-button" onclick="switchTab('files')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span>Files</span>
            </button>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            if (tab === 'chat') {
                document.getElementById('chat-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[0].classList.add('active');
            } else {
                document.getElementById('files-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[1].classList.add('active');
            }
        }
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            const messages = document.getElementById('chat-messages');
            const userBubble = document.createElement('div');
            userBubble.className = 'bubble user';
            userBubble.textContent = text;
            messages.appendChild(userBubble);
            input.value = '';
            setTimeout(() => {
                const botBubble = document.createElement('div');
                botBubble.className = 'bubble bot';
                botBubble.textContent = 'Draft response — oMLX connection comes later.';
                messages.appendChild(botBubble);
                messages.scrollTop = messages.scrollHeight;
            }, 500);
            messages.scrollTop = messages.scrollHeight;
        }
        document.getElementById('chat-input')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
