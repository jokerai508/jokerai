<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Joker AI — Futuristic Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(135deg, #0a0e27 0%, #000010 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #0a0e27;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 200, 255, 0.15), 0 0 0 1px rgba(0, 200, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #1a1f3a;
        }
        .status-bar {
            height: 44px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
            color: #00c8ff;
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
        }
        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .tab-content.active {
            display: flex;
        }
        .chat-header {
            height: 50px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #00c8ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 200, 255, 0.25);
            box-shadow: 0 2px 20px rgba(0, 200, 255, 0.08);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #0a0e27;
        }
        .bubble {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.45;
            word-wrap: break-word;
            position: relative;
        }
        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #007aff 0%, #00c8ff 100%);
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.3);
        }
        .bubble.bot {
            align-self: flex-start;
            background: rgba(20, 30, 60, 0.8);
            backdrop-filter: blur(10px);
            color: #e8e4d9;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .chat-input-area {
            padding: 10px 14px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            background: rgba(20, 30, 60, 0.6);
            color: #e8e4d9;
            box-shadow: inset 0 2px 8px rgba(0, 200, 255, 0.08);
        }
        .chat-input-area input::placeholder {
            color: #5a6278;
        }
        .chat-input-area button {
            padding: 10px 18px;
            background: linear-gradient(135deg, #007aff 0%, #00c8ff 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.4);
        }
        .chat-input-area button:disabled {
            opacity: 0.4;
            box-shadow: none;
        }
        .files-header {
            height: 50px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #00c8ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 200, 255, 0.25);
            box-shadow: 0 2px 20px rgba(0, 200, 255, 0.08);
        }
        .files-list {
            flex: 1;
            overflow-y: auto;
            background: #0a0e27;
        }
        .file-item {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 15px;
            color: #00c8ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }
        .file-item:hover {
            background: rgba(0, 200, 255, 0.08);
        }
        .file-item:active {
            background: rgba(0, 200, 255, 0.15);
        }
        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.3), rgba(0, 200, 255, 0.2));
            border: 1px solid rgba(0, 200, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #00c8ff;
            font-weight: 700;
        }
        .file-info {
            flex: 1;
        }
        .file-name {
            font-weight: 600;
            color: #e8e4d9;
            margin-bottom: 2px;
        }
        .file-meta {
            font-size: 12px;
            color: #6b7280;
        }
        .tab-bar {
            height: 84px;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 200, 255, 0.2);
            display: flex;
            justify-content: space-around;
            padding-bottom: 20px;
        }
        .tab-button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: #5a6278;
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .tab-button.active {
            color: #00c8ff;
        }
        .tab-button svg {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 4px rgba(0, 200, 255, 0.4));
        }
        .tab-button.active svg {
            filter: drop-shadow(0 0 8px rgba(0, 200, 255, 0.8));
        }
        .loading-dots {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #00c8ff;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.6);
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 420px) {
            .phone-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>●●●●○ 5G</span>
        </div>
        <div class="content">
            <div class="tab-content active" id="chat-tab">
                <div class="chat-header">Joker AI</div>
                <div class="chat-messages" id="chat-messages">
                    <div class="bubble bot">Hello! I'm Joker AI. How can I help you today?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Type a message..." id="chat-input">
                    <button onclick="sendMessage()" id="send-btn">Send</button>
                </div>
            </div>
            <div class="tab-content" id="files-tab">
                <div class="files-header">Moomoo / Files</div>
                <div class="files-list">
                    <div class="file-item">
                        <div class="file-icon">H</div>
                        <div class="file-info">
                            <div class="file-name">hourly_stock_analysis.md</div>
                            <div class="file-meta">Markdown • Updated 09:42</div>
                        </div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon">M</div>
                        <div class="file-info">
                            <div class="file-name">market-trend.html</div>
                            <div class="file-meta">HTML • Updated 09:36</div>
                        </div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon">P</div>
                        <div class="file-info">
                            <div class="file-name">portfolio_report_2026.html</div>
                            <div class="file-meta">HTML • Updated 09:37</div>
                        </div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon">N</div>
                        <div class="file-info">
                            <div class="file-name">malaysia-news.html</div>
                            <div class="file-meta">HTML • Updated 09:37</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-bar">
            <button class="tab-button active" onclick="switchTab('chat')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <span>Chat</span>
            </button>
            <button class="tab-button" onclick="switchTab('files')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span>Files</span>
            </button>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            if (tab === 'chat') {
                document.getElementById('chat-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[0].classList.add('active');
            } else {
                document.getElementById('files-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[1].classList.add('active');
            }
        }
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            const messages = document.getElementById('chat-messages');
            const userBubble = document.createElement('div');
            userBubble.className = 'bubble user';
            userBubble.textContent = text;
            messages.appendChild(userBubble);
            input.value = '';
            const loading = document.createElement('div');
            loading.className = 'bubble bot loading-dots';
            loading.innerHTML = '<span></span><span></span><span></span>';
            messages.appendChild(loading);
            messages.scrollTop = messages.scrollHeight;
            setTimeout(() => {
                loading.remove();
                const botBubble = document.createElement('div');
                botBubble.className = 'bubble bot';
                botBubble.textContent = 'Draft response — oMLX connection comes later.';
                messages.appendChild(botBubble);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
            messages.scrollTop = messages.scrollHeight;
        }
        document.getElementById('chat-input')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
