<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Joker AI</title>
<style>
  html { background: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #020408;
    color: #e6f1ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #00f0ff, #7b2fff, #00ffc8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #8aa3c9;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .btn {
    display: inline-block;
    background: #00aa22;
    color: #000;
    border: 2px solid #00aa22;
    padding: 14px 28px;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #00aa22;
    font-family: 'Courier New', Courier, monospace;
    text-decoration: none;
    margin: 8px;
    transition: transform 0.1s;
  }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #00aa22; }
  .btn.secondary {
    background: transparent;
    color: #00aa22;
    border: 2px solid #00aa22;
    box-shadow: 4px 4px 0 #00aa22;
  }
  .links {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .footer {
    position: fixed;
    bottom: 12px;
    color: #4a5a7a;
    font-size: 11px;
  }
</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
  <div class="logo">JOKER AI</div>
  <div class="subtitle">Singapore · Malaysia</div>
  <div class="links">
    <a href="reports.html" class="btn">📊 REPORTS</a>
    <a href="resume.html" class="btn secondary">📄 RESUME / CV</a>
  </div>
  <div class="footer">Joker AI · 2026</div>
<p style="text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;">Last updated: 2026-10-28 19:15 SGT</p>
</body>
</html>
