<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joker AI — Cron Dashboard</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #11151b;
    --text: #e8e4d9;
    --muted: #9aa3ad;
    --green: #4ade80;
    --red: #f87171;
    --gold: #d4a93c;
    --border: #1e2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 24px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }
  .badge {
    font-size: 12px;
    color: var(--muted);
    background: #0f1318;
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 999px;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .08s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title {
    font-weight: 600;
    font-size: 15px;
  }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #0f1318;
    color: var(--muted);
    white-space: nowrap;
  }
  .status.ok { color: var(--green); border-color: #153323; background: #0b1a14; }
  .status.failed { color: var(--red); border-color: #3b1418; background: #1a0d10; }
  .status.pending { color: var(--gold); border-color: #3b2a0d; background: #1a160b; }
  .meta {
    font-size: 12px;
    color: var(--muted);
  }
  .output {
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #d6d2c5;
    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .link {
    color: #93c5fd;
    text-decoration: none;
    font-size: 12px;
  }
  .link:hover { text-decoration: underline; }
  footer {
    max-width: 1100px;
    margin: 18px auto 0;
    color: var(--muted);
    font-size: 12px;
  }
  .updated {
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Joker AI — Cron Dashboard</h1>
    <div class="updated" id="updated">Last updated: --</div>
  </div>
  <div class="badge">Local outputs from ~/.hermes/cron/output</div>
</header>
<div class="grid" id="cards"></div>
<footer>
  Delivered via GitHub Pages • Repo: jokerai508/jokerai

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row">

      </div>
      <div class="meta">

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
